include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - lint
  - security
  - pip-licenses
  - test
  - performance
  - metrics
  - timestamp
  - docker
  - request-merge
  - test-and-release

# =========================================================
# OPEN TIMESTAMP STAGE
# =========================================================

ots:timestamp_commit:
  extends: .python_base
  stage: timestamp
  script:
    - pip install opentimestamps
    - python ci-tooling/ots_stamp.py
  artifacts:
    paths:
      - ots-proofs/
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  allow_failure: true

ots:push_proofs:
  stage: test-and-release
  extends: .python_base
  needs:
    - ots:timestamp_commit
  script:
    - pip install opentimestamps
    - python ci-tooling/ots_stamp.py
    - git config user.email "ci@plexichat.com"
    - git config user.name "Plexichat CI"
    - git fetch origin ots-proofs || true
    - |
      if git rev-parse --verify origin/ots-proofs >/dev/null 2>&1; then
        git checkout -B ots-proofs origin/ots-proofs
      else
        git checkout --orphan ots-proofs
        git rm -rf . 2>/dev/null || true
        rm -rf .git/ots-proofs 2>/dev/null || true
      fi
    - mkdir -p ots-proofs
    - cp ots-proofs/*.ots ots-proofs/ 2>/dev/null || true
    - git add ots-proofs/
    - |
      if git diff --cached --quiet; then
        echo "No new proofs to commit"
      else
        git commit -m "OTS proof: $CI_COMMIT_SHA"
        git push origin ots-proofs
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  allow_failure: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # No repository-wide PIP_INDEX_URL / PIP_TRUSTED_HOST here on purpose.
  #
  # A committed plaintext-HTTP package index applies to *every* job, so an
  # on-path attacker could inject arbitrary wheels (and thus control the
  # dependency tree, including the unhashed `pip install pip-audit safety`
  # bootstrap). Jobs now install from the default HTTPS PyPI index unless the
  # operator deliberately points them at an internal mirror.
  #
  # To use an internal mirror, define PIP_INDEX_URL as a *protected, masked*
  # CI/CD variable (Settings -> CI/CD -> Variables) with an https:// URL.
  # If — and only if — a mirror genuinely cannot serve TLS, also set
  # PLEXICHAT_CI_ALLOW_INSECURE_INDEX=1 (plus the host's PIP_TRUSTED_HOST);
  # the guard in .python_base.before_script keeps that a loud, explicit
  # opt-in rather than a silent default.
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

  # Fail closed before any pip install when a plaintext HTTP index is
  # configured without an explicit opt-in (Agent 55 F23).
  PLEXICHAT_CI_ALLOW_INSECURE_INDEX: "0"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .venv/
    - .cache/pip
  policy: pull-push

# =========================================================
# BASE PYTHON ENV (shared)
# =========================================================

.python_base:
  image: 
    name: python:3.14.6-slim-trixie
    pull_policy: if-not-present
  before_script:
    - apt-get update -qq && apt-get upgrade -y -qq && apt-get install -y -qq --no-install-recommends git libatomic1
    - |
      # Refuse a plaintext HTTP package index unless the operator has
      # explicitly opted in; otherwise the build could be hijacked by an
      # on-path attacker (Agent 55 F23).
      case "${PIP_INDEX_URL:-}" in
        http://*)
          if [ "${PLEXICHAT_CI_ALLOW_INSECURE_INDEX:-0}" != "1" ]; then
            echo "FATAL: PIP_INDEX_URL uses plaintext http:// without PLEXICHAT_CI_ALLOW_INSECURE_INDEX=1" >&2
            echo "       Use an https:// mirror or set the opt-in variable deliberately." >&2
            exit 1
          fi
          echo "WARNING: installing from a plaintext HTTP package index (PIP_INDEX_URL=$PIP_INDEX_URL); PLEXICHAT_CI_ALLOW_INSECURE_INDEX=1." >&2
          ;;
      esac
    - |
      if [ -d ".venv" ]; then
        echo "Using cached virtual environment"
        source .venv/bin/activate
      else
        echo "Creating new virtual environment"
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
      fi
      pip install pip-audit safety
    # common_utils is bundled directly in the repository at src/utils/common_utils/
  after_script:
    # Free disk space — remove temp files but keep cached .venv and pip
    - rm -rf .plexichat/logs .plexichat/data .plexichat/media .plexichat/temp 2>/dev/null || true
    - docker system prune -f --volumes 2>/dev/null || true

# =========================================================
# LINT STAGE (Consolidated via pre-commit)
# =========================================================

lint:pre-commit:
  extends: .python_base
  stage: lint
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
    NODE_OPTIONS: "--max-old-space-size=2048"
    UV_THREADPOOL_SIZE: "4"
  cache:
    - key:
        files:
          - requirements.txt
      paths:
        - .venv/
        - .cache/pip
      policy: pull-push
    - key:
        files:
          - .pre-commit-config.yaml
          - requirements.txt
        prefix: precommit-tools-${CI_COMMIT_REF_SLUG}
      paths:
        - .cache/pre-commit
      policy: pull-push
  before_script:
    - apt-get update -qq && apt-get upgrade -y -qq && apt-get install -y -qq --no-install-recommends git libatomic1 nodejs
    - |
      # Same fail-closed package-index guard as .python_base (Agent 55 F23).
      case "${PIP_INDEX_URL:-}" in
        http://*)
          if [ "${PLEXICHAT_CI_ALLOW_INSECURE_INDEX:-0}" != "1" ]; then
            echo "FATAL: PIP_INDEX_URL uses plaintext http:// without PLEXICHAT_CI_ALLOW_INSECURE_INDEX=1" >&2
            exit 1
          fi
          echo "WARNING: installing from a plaintext HTTP package index (PIP_INDEX_URL=$PIP_INDEX_URL); PLEXICHAT_CI_ALLOW_INSECURE_INDEX=1." >&2
          ;;
      esac
    - |
      if [ -d ".venv" ]; then
        echo "Using cached virtual environment"
        source .venv/bin/activate
      else
        echo "Creating new virtual environment"
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
      fi
    - pip install ruff==0.15.10 pyright bandit[toml] detect-secrets pre-commit pip-audit
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ] || [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "Tag/MR pipeline — running pre-commit on all files"
        pre-commit run --all-files --show-diff-on-failure
      else
        FROM_REF="${CI_COMMIT_BEFORE_SHA}"
        if [ "$FROM_REF" = "0000000000000000000000000000000000000000" ] || [ -z "$FROM_REF" ]; then
          FROM_REF="origin/dev"
        fi
        echo "Branch pipeline — running pre-commit on changed files (from $FROM_REF)"
        pre-commit run --from-ref "$FROM_REF" --to-ref "$CI_COMMIT_SHA" --show-diff-on-failure
      fi

# =========================================================
# SECURITY STAGE (FULL COVERAGE)
# =========================================================

# Bandit and detect-secrets are now handled by pre-commit in the lint stage.
# We keep GitLab-specific and dependency scanning jobs here.

# --- GitLab Secret Detection (extra coverage) ---
security:secret_detection:  # pragma: allowlist secret
  stage: security
  image: registry.gitlab.com/gitlab-org/security-products/analyzers/secrets:latest  # pragma: allowlist secret
  variables:
    GIT_DEPTH: 100
  before_script: []
  cache: {}
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json  # pragma: allowlist secret
    paths:
      - gl-secret-detection-report.json
    expire_in: 30 days
  allow_failure: false

# --- SAST (Semgrep) ---
security:sast:
  stage: security
  image: registry.gitlab.com/gitlab-org/security-products/analyzers/semgrep:latest
  variables:
    SAST_EXCLUDED_PATHS: ".venv/,venv/,tests/,.cache/,build/,dist/"
    GIT_DEPTH: 0
  before_script: []
  cache: {}
  script:
    - /analyzer run
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 30 days
  allow_failure: true

# --- Dependency scanning (NOT in pre-commit, keep it) ---
security:dependency_scanning:
  extends: .python_base
  stage: security
  script:
    - pip-audit -r requirements.txt --format json > pip-audit-report.json
    - pip-audit -r requirements.txt
    # License gate: fails on a new copyleft dependency or one whose license
    # cannot be resolved. Reviewed exceptions live in ALLOWED_COPYLEFT in
    # ci-tooling/license_audit.py and are documented in THIRD_PARTY_NOTICES.md.
    - python ci-tooling/license_audit.py
    - mkdir -p ./bin && curl -sfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64.tar.gz | tar -xz -C ./bin osv-scanner || true
    - ./bin/osv-scanner --format json --output osv-report.json . || true
    - ./bin/osv-scanner . || true
  artifacts:
    paths:
      - pip-audit-report.json
      - osv-report.json
    expire_in: 30 days

# =========================================================
# PIP-LICENSES STAGE (permissive-only license gate, round 2)
# =========================================================

# Independent second opinion on top of the license_audit.py step inside
# security:dependency_scanning: the `pip-licenses` tool dumps every installed
# distribution's license, and ci-tooling/check_pip_licenses.py gates the
# pinned runtime tree in requirements.txt against the same permissive-only
# policy (PERMISSIVE / ALLOWED_* in license_audit.py — shared, not duplicated).
# Anything installed but not pinned there (pip-audit, safety, pip-licenses
# itself, …) is tooling, not shipped code, and is out of scope.
# Fails closed on any non-permissive or unresolvable license.
pip-licenses:
  extends: .python_base
  stage: pip-licenses
  script:
    # Floor-pinned (not hashed): audit tooling follows the same precedent as
    # `pip install pip-audit safety` in .python_base — latest 4.x+ keeps the
    # stable --format=json schema (Name/Version/License) this gate parses.
    - pip install "pip-licenses>=4.3"
    - pip-licenses --format=json --output-file=pip-licenses.json
    - pip-licenses --format=plain-vertical
    - python ci-tooling/check_pip_licenses.py pip-licenses.json
  artifacts:
    paths:
      - pip-licenses.json
    expire_in: 30 days

# =========================================================
# TEST STAGE (Unit/Integration + API Self-Test)
# =========================================================

test:pytest:
  extends: .python_base
  stage: test
  timeout: 1h
  script:
    # pytest and its plugins (asyncio, benchmark, xdist, timeout) are test-only
    # and live in requirements-dev.in, so the runtime lock no longer carries
    # them. The dev lock is a superset of the runtime tree, so installing it
    # here is safe on top of a cached .venv.
    - pip install --require-hashes -r requirements-dev.txt
    # Full unit + integration suite. ``--maxfail=20`` keeps a broken commit
    # from burning the whole 1h timeout listing failures; the default pytest.ini
    # addopts already deselect slow/performance/postgres tests. The JUnit
    # report feeds the performance:no_slow_tests gate in the next stage.
    - python -m pytest -q --maxfail=20 --durations=25 --junitxml=test-results.xml
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.xml
    expire_in: 1 week

# The PlexiSum engine's cross-engine contract gets its own job.
#
# The shared case table (src/tests/suite/formula_parity_cases.json) is the
# statement of the formula semantics this engine and the PlexiSum client engine
# must both satisfy, and the parity test also pins the table's digest so an
# edit to either repository's copy that is not mirrored in the other fails
# here. Running it as a named job keeps a broken contract a blocking, visible
# check instead of one red line buried in test:pytest.
test:formula_parity:
  extends: .python_base
  stage: test
  timeout: 15m
  script:
    - pip install --require-hashes -r requirements-dev.txt
    - >
      python -m pytest -q
      src/tests/suite/test_sum_formula_parity.py
      src/tests/suite/test_sum_formulas.py
  needs: []
  allow_failure: false

# Order-independence gate. The suite is required to pass in any file order,
# and the only way to keep that true is to actually run it in a different
# one. A fixed seed makes the order -- and any failure it exposes --
# reproducible: replay locally with the same --shuffle-seed value. Files stay
# whole, so this is the same test set as test:pytest in a shuffled order.
test:shuffled_order:
  extends: .python_base
  stage: test
  timeout: 1h
  variables:
    SHUFFLE_SEED: "424242"
  script:
    - pip install --require-hashes -r requirements-dev.txt
    - python -m pytest -q --maxfail=20 --shuffle-seed "$SHUFFLE_SEED"
  needs: []
  allow_failure: false

# Dedicated run of the database-backed suites against real services.
#
# ``test:pytest`` runs everything else, but with no backend reachable the
# Postgres/Valkey fixtures skip and the job still goes green -- which is how
# the SQL bugs these suites exist to catch rotted unnoticed. Here the
# services are real, ``USE_DOCKER=false`` tells the fixtures to attach to
# them instead of spawning containers, and a failure fails the pipeline.
test:database_backends:
  extends: .python_base
  stage: test
  timeout: 30m
  services:
    - name: postgres:15-alpine
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        # Throwaway service container credentials, not a real secret.
        POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
        POSTGRES_DB: test_db
    - name: valkey/valkey:8-alpine
      alias: valkey
  variables:
    USE_DOCKER: "false"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
    POSTGRES_DB: test_db
    VALKEY_HOST: valkey
    VALKEY_PORT: "6379"
  script:
    - pip install --require-hashes -r requirements-dev.txt
    # ``-m`` overrides pytest.ini's addopts deselect so the
    # ``production_simulation`` cases (which are exactly the multi-worker
    # ones) run here. ``slow``/``performance`` stay out: they are duration
    # tests, not correctness ones, and have their own gate.
    - >
      python -m pytest -q -m "not slow and not performance"
      --durations=25 --junitxml=test-results-db.xml
      src/tests/test_postgres_docker.py
      src/tests/test_transactions.py
      src/tests/test_database.py
      src/tests/test_production_simulation.py
      src/tests/test_valkey_docker.py
    # These suites skip silently when a backend is missing. A skip here
    # means the services above did not come up, which must be a failure
    # rather than a green pipeline with no coverage.
    - |
      if grep -qE 'skipped="[1-9]' test-results-db.xml; then
        echo "FATAL: database-backed tests skipped -- the postgres/valkey services were not reachable" >&2
        exit 1
      fi
  artifacts:
    when: always
    reports:
      junit: test-results-db.xml
    paths:
      - test-results-db.xml
    expire_in: 1 week

# =========================================================
# PERFORMANCE STAGE (test-duration gate)
# =========================================================

# Hard gate: the whole test stage is green, but any single test slower than
# 5 seconds still fails the pipeline. Prevents performance regressions from
# slipping in as the suite grows. Uses only the Python stdlib, so it does not
# extend .python_base (no dependency install for a trivial parser). Note that
# pytest.ini deselects ``slow``/``performance``-marked tests from the run, so
# this gate deliberately enforces only the fast suite that CI actually runs.
performance:no_slow_tests:
  stage: performance
  image:
    name: python:3.14.6-slim-trixie
    pull_policy: if-not-present
  needs:
    - test:pytest
  script:
    # The metrics JSON is uploaded alongside the gate verdict and feeds the
    # metrics:trend job in the next stage.
    - python ci-tooling/check_slow_tests.py test-results.xml --threshold 5.0 --job test:pytest --metrics-out test-durations.json
  artifacts:
    when: always
    paths:
      - test-durations.json
    expire_in: 1 week
  allow_failure: false

# =========================================================
# METRICS STAGE (per-job duration trend)
# =========================================================

# Accumulates the per-job test durations from the performance gate on the
# ``ci-metrics`` branch (JSONL history + rendered index.html) so regressions
# show over time. Mirrors the ots:push_proofs pattern: fetch the branch,
# append, render, push back. allow_failure keeps a transient push race from
# reddening the pipeline; the next run catches the branch up.
metrics:trend:
  stage: metrics
  image:
    name: python:3.14.6-slim-trixie
    pull_policy: if-not-present
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git config --global user.email "ci@plexichat.com"
    - git config --global user.name "Plexichat CI"
  needs:
    - performance:no_slow_tests
  script:
    # The ci-metrics branch only tracks ci-metrics.jsonl + index.html, so
    # checking it out would delete ci-tooling/ from the worktree.  Copy the
    # publish script to /tmp first, and fetch the branch (CI only checks
    # out the pipeline ref by default, so ci-metrics is not local).
    - cp ci-tooling/trend_publish.py /tmp/trend_publish.py
    - git fetch origin ci-metrics || true
    - |
      if git rev-parse --verify origin/ci-metrics >/dev/null 2>&1; then
        git checkout -B ci-metrics origin/ci-metrics
      else
        git checkout --orphan ci-metrics
        git rm -rf . 2>/dev/null || true
      fi
    - python /tmp/trend_publish.py merge --metrics test-durations.json --history ci-metrics.jsonl --out ci-metrics.jsonl
    - python /tmp/trend_publish.py render --history ci-metrics.jsonl --out index.html --project "$CI_PROJECT_PATH" --gate 5.0
    - |
      git add ci-metrics.jsonl index.html
      if git diff --cached --quiet; then
        echo "No new metrics to commit"
      else
        git commit -m "CI metrics: $CI_COMMIT_SHORT_SHA"
        PUSHED=0
        for attempt in 1 2 3; do
          if git push origin ci-metrics 2>/dev/null; then
            PUSHED=1
            break
          fi
          echo "push attempt $attempt failed; rebasing onto remote"
          git pull --rebase origin ci-metrics 2>/dev/null || true
        done
        if [ "$PUSHED" != "1" ]; then
          echo "WARN: ci-metrics push failed after retries (trend catches up next run)"
        fi
      fi
  artifacts:
    when: always
    paths:
      - index.html
      - ci-metrics.jsonl
    expire_in: 1 year
  allow_failure: true

test:self_test:
  extends: .python_base
  stage: test
  timeout: 1h
  script:
    - mkdir -p .plexichat
    # Protected branches (master, etc.) set $PLEXICHAT_LICENSE in the CI
    # secret store, so the licensed-only PlexiJoin endpoints can be exercised.
    # On non-protected branches (feature branches like plexisuite-expansion)
    # the variable is absent, so we pass --unlicensed to skip those
    # license-gated routes. The self-test never auto-detects licensing state
    # from the machine, so the operator must opt in explicitly via the flag.
    - |
      if [ -n "${PLEXICHAT_LICENSE:-}" ]; then
        python main.py self-test
      else
        python main.py self-test --unlicensed
      fi

docker:build_and_push:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # TLS for the dind socket (Agent 55 F22). With a non-empty
    # DOCKER_TLS_CERTDIR the dind service auto-generates a CA and client
    # certs, so builds never talk to an unauthenticated tcp://docker:2375
    # socket that would be root-equivalent for anyone on the job network.
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  script:
    - echo "Building backend docker image for tag $CI_COMMIT_TAG"
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_TAG -t $CI_REGISTRY/$CI_PROJECT_PATH/backend:latest .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/backend:latest
    # Push to Docker Hub
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker tag $CI_REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_TAG plexichat/plexichat:$CI_COMMIT_TAG
    - docker tag $CI_REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_TAG plexichat/plexichat:latest
    - docker push plexichat/plexichat:$CI_COMMIT_TAG
    - docker push plexichat/plexichat:latest

container_scanning:
  stage: docker
  variables:
    CS_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH/backend:$CI_COMMIT_TAG"
    CS_REGISTRY_USER: "$CI_REGISTRY_USER"
    CS_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    CS_REGISTRY_INSECURE: "${CI_REGISTRY_INSECURE:-false}"
  needs:
    - docker:build_and_push
  rules:
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  allow_failure: true

docker:backup:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # TLS for the dind socket (Agent 55 F22). With a non-empty
    # DOCKER_TLS_CERTDIR the dind service auto-generates a CA and client
    # certs, so builds never talk to an unauthenticated tcp://docker:2375
    # socket that would be root-equivalent for anyone on the job network.
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  script:
    - echo "Building backup docker image for tag $CI_COMMIT_TAG"
    - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH/backup:$CI_COMMIT_TAG -t $CI_REGISTRY/$CI_PROJECT_PATH/backup:latest docker/backup/
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/backup:$CI_COMMIT_TAG
    - docker push $CI_REGISTRY/$CI_PROJECT_PATH/backup:latest
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker tag $CI_REGISTRY/$CI_PROJECT_PATH/backup:$CI_COMMIT_TAG plexichat/plexichat-backup:$CI_COMMIT_TAG
    - docker tag $CI_REGISTRY/$CI_PROJECT_PATH/backup:$CI_COMMIT_TAG plexichat/plexichat-backup:latest
    - docker push plexichat/plexichat-backup:$CI_COMMIT_TAG
    - docker push plexichat/plexichat-backup:latest

docker:cleanup_old_images:
  stage: docker
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    # TLS for the dind socket (Agent 55 F22). With a non-empty
    # DOCKER_TLS_CERTDIR the dind service auto-generates a CA and client
    # certs, so builds never talk to an unauthenticated tcp://docker:2375
    # socket that would be root-equivalent for anyone on the job network.
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^a\.\d+\.\d+-\d+$/'
  script:
    - echo "Cleaning up old Docker images based on retention policy"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      # Get all tags for backend image
      ALL_TAGS=$(docker image ls --format '{{.Tag}}' $CI_REGISTRY/$CI_PROJECT_PATH/backend | grep -E '^a\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V || true)
      
      # Separate by version type
      ALPHA_TAGS=$(echo "$ALL_TAGS" | grep -E '\-alpha' || echo "")
      BETA_TAGS=$(echo "$ALL_TAGS" | grep -E '\-beta' || echo "")
      RELEASE_TAGS=$(echo "$ALL_TAGS" | grep -v -E '\-(alpha|beta)' || echo "")
      
      # Keep last 5 alpha builds
      if [ -n "$ALPHA_TAGS" ]; then
        ALPHA_TO_DELETE=$(echo "$ALPHA_TAGS" | head -n -5)
        for tag in $ALPHA_TO_DELETE; do
          echo "Deleting old alpha build: $tag"
          docker rmi $CI_REGISTRY/$CI_PROJECT_PATH/backend:$tag || true
        done
      fi
      
      # Keep last 10 beta builds
      if [ -n "$BETA_TAGS" ]; then
        BETA_TO_DELETE=$(echo "$BETA_TAGS" | head -n -10)
        for tag in $BETA_TO_DELETE; do
          echo "Deleting old beta build: $tag"
          docker rmi $CI_REGISTRY/$CI_PROJECT_PATH/backend:$tag || true
        done
      fi
      
      # Keep all releases (no deletion)
      echo "Keeping all release tags: $RELEASE_TAGS"
  allow_failure: true

create_merge_request:
  stage: request-merge
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      AUTH="PRIVATE-TOKEN: ${PLEXICHAT_MR_PAT}"
      
      echo "Creating merge request from dev to master..."
      RESPONSE=$(curl --silent --request POST \
        --header "$AUTH" \
        --data "source_branch=dev" \
        --data "target_branch=master" \
        --data "title=Automated Release Merge" \
        --data "remove_source_branch=false" \
        "${API}/merge_requests")
      
      MR_IID=$(echo "$RESPONSE" | jq -r '.iid // empty')
      
      if [ -z "$MR_IID" ]; then
        echo "MR creation returned: $(echo "$RESPONSE" | jq -r '.message // .')"
        echo "Checking for existing MR from dev to master..."
        EXISTING=$(curl --silent --header "$AUTH" \
          "${API}/merge_requests?source_branch=dev&target_branch=master&state=opened")
        MR_IID=$(echo "$EXISTING" | jq -r '.[0].iid // empty')
        if [ -z "$MR_IID" ]; then
          echo "No existing MR found. Cannot set auto-merge."
          exit 0
        fi
        echo "Found existing MR !$MR_IID"
      else
        echo "MR created: !$MR_IID"
      fi
      
      echo "Setting auto-merge (merge when pipeline succeeds)..."
      curl --request PUT \
        --header "$AUTH" \
        --data "merge_when_pipeline_succeeds=true" \
        --data "should_remove_source_branch=false" \
        "${API}/merge_requests/${MR_IID}/merge" | jq '.'
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

validate_master_and_tag:
  stage: test-and-release
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - echo "Running production validation suite on master..."
    - exit 0
    - BUILD_TAG="a.1.0-build${CI_PIPELINE_IID}"
    - COMMIT_MSG=$(git log -1 --pretty=%B)
    - echo "All tests passed. Tagging commit as $BUILD_TAG"
    - git config --global user.email "automerge@plexichat.com"
    - git config --global user.name "Plexichat automerge dev into master"
    - git tag -a "$BUILD_TAG" -m "$COMMIT_MSG"
    - REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push "$REPO_URL" "$BUILD_TAG" -o ci.skip
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
