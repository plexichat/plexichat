# Two pipelines come out of this file.
#
# The commit pipeline -- push, tag, merge request, schedule -- is
# .gitlab/ci/pipeline.yml, included for every pipeline that is not the live
# smoke gate, so a normal pipeline is exactly what it was when this file held
# that config inline.
#
# The live smoke gate is .gitlab/ci/live-smoke.yml, a pipeline of its own. It
# exercises the running deployment over HTTP: it registers and deletes real
# accounts, writes real messages, and login/registration are limited per source
# IP. As a manual job in the commit pipeline it also held every pipeline at
# "manual" -- not green -- until someone clicked it. Run it on purpose:
#
#   CI/CD > Pipelines > Run pipeline, branch dev (or the release tag),
#   with RUN_LIVE_SMOKE=1
#
# That pipeline creates the smoke job and nothing else.
workflow:
  rules:
    - if: '$RUN_LIVE_SMOKE == "1"'
    - when: always

include:
  - local: .gitlab/ci/pipeline.yml
    rules:
      - if: '$RUN_LIVE_SMOKE != "1"'
  - local: .gitlab/ci/live-smoke.yml
    rules:
      - if: '$RUN_LIVE_SMOKE == "1"'

# Supply-chain gates live in this file, not in either included pipeline, so a
# normal pipeline and a live-smoke run cannot disagree about whether a lock is
# hashed. The `RUN_LIVE_SMOKE != "1"` rule keeps them out of the smoke pipeline,
# which is deliberately a single job.

# Every direct dependency must be an exact `name==version` pin, every compiled
# lock entry must carry a sha256 artifact hash, and the two must agree. A new
# unpinned addition -- in an .in file or a hand-edited lock -- fails here.
supplychain:pinned_deps:
  stage: security
  timeout: 10m
  image: python:3.14-slim
  needs: []
  rules:
    - if: '$RUN_LIVE_SMOKE != "1"'
  before_script: []
  script:
    - python ci-tooling/check_pinned_deps.py
  allow_failure: false

# A token is a capability, so the gates below deliberately declare none: they
# read the checkout and the policy files, and nothing else. The permission
# checker enforces the same rule on every other job -- privileged variables
# only in allowlisted jobs, OIDC tokens only with a bounded audience, git push
# only from declared write jobs. A widening fails supplychain:permissions.
supplychain:secrets_baseline:
  stage: security
  timeout: 10m
  image: python:3.14-slim
  needs: []
  rules:
    - if: '$RUN_LIVE_SMOKE != "1"'
  before_script: []
  script:
    - python ci-tooling/check_secrets_baseline.py
  allow_failure: false

supplychain:permissions:
  stage: security
  timeout: 10m
  image: python:3.14-slim
  needs: []
  rules:
    - if: '$RUN_LIVE_SMOKE != "1"'
  before_script: []
  script:
    - python ci-tooling/check_ci_permissions.py
  allow_failure: false

supplychain:checksums:
  stage: security
  timeout: 10m
  image: python:3.14-slim
  needs: []
  rules:
    - if: '$RUN_LIVE_SMOKE != "1"'
  before_script: []
  script:
    - python ci-tooling/check_artifact_checksums.py
  allow_failure: false

supplychain:regressions:
  stage: security
  timeout: 20m
  image: python:3.14-slim
  needs: []
  rules:
    - if: '$RUN_LIVE_SMOKE != "1"'
  before_script: []
  script:
    - python ci-tooling/test_supply_chain.py
  allow_failure: false
