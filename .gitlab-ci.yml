# Two pipelines come out of this file.
#
# The commit pipeline -- push, tag, merge request, schedule -- is
# .gitlab/ci/pipeline.yml, included for every pipeline that is not the live
# smoke gate, so a normal pipeline is exactly what it was when this file held
# that config inline.
#
# The live smoke gate is .gitlab/ci/live-smoke.yml, a pipeline of its own. It
# exercises the running deployment over HTTP: it registers and deletes real
# accounts, writes real messages, and login/registration are limited per source
# IP. As a manual job in the commit pipeline it also held every pipeline at
# "manual" -- not green -- until someone clicked it. Run it on purpose:
#
#   CI/CD > Pipelines > Run pipeline, branch dev (or the release tag),
#   with RUN_LIVE_SMOKE=1
#
# That pipeline creates the smoke job and nothing else.
workflow:
  rules:
    - if: '$RUN_LIVE_SMOKE == "1"'
    - when: always

include:
  - local: .gitlab/ci/pipeline.yml
    rules:
      - if: '$RUN_LIVE_SMOKE != "1"'
  - local: .gitlab/ci/live-smoke.yml
    rules:
      - if: '$RUN_LIVE_SMOKE == "1"'
