# The live smoke gate: one job, one pipeline, run on purpose.
#
# It drives the running production deployment over HTTP (ci-tooling/live-smoke.sh):
# real registrations, logins, servers, messages, bookmarks by channel id,
# threads, DMs, search and an account deletion. That is not a per-commit check --
# it writes to the deployment the users are on and it is rate limited per source
# IP -- and as a manual job inside the commit pipeline it left every pipeline in
# the "manual" state, which is not green, until someone clicked it.
#
# Run it from CI/CD > Pipelines > Run pipeline on dev (or the release tag) with
# RUN_LIVE_SMOKE=1; .gitlab-ci.yml then includes this file and nothing else.
stages:
  - smoke

# Validate the master checkout, then mark it as a build.
#
# This job used to open with ``exit 0`` (added 2026-07-28): the validation never
# ran and the tag was never created, so every master pipeline reported a green
# "production validation suite" for a job that did nothing, and the repository
# holds no build marker at all -- the newest tag of any kind is the ``1.0.0a131``
# release from 07-30. The validation is now ``pre-flight`` -- it builds the
# configuration, initialises every module against the real database layer and
# exits without binding a port -- and the tag push is checked, so a job whose
# product is the tag fails when the tag cannot be created. The master pipeline's
# test stage is still the real gate; this proves the tree the tag points at
# loads.
#
# The tag is a build marker (``1.0.0-build<N>``), not a release: it does not match
# the ``X.Y.Z[abrc]N`` pattern the docker and release jobs
# trigger on, and ``-o ci.skip`` keeps it from starting a pipeline of its own.
# Releases stay deliberate -- merge a dev commit that carries an ``X.Y.Z`` tag,
# which is what ``create_merge_request`` requires (see
# docs/deployment/versioning.md).
# Post-deploy smoke gate: the curl suite in ci-tooling/live-smoke.sh, run
# against a live deployment after it is updated (manual, so a release is not
# blocked while the deploy itself is still rolling out). It exercises the real
# HTTP surface the client uses -- auth, profiles, relationships, servers,
# messaging, bookmarks by channel id, threads, DMs, search -- and covers account
# deletion by freezing a member of the deployment's seeded deletion ring.
#
# Point it at the deployment with PLEXICHAT_BASE_URL. Registration and login
# are rate limited per client IP (3/minute, 10/hour, 20/day for register) and a
# runner shares its egress address, so the suite keeps its own
# `smoke_gate_{a,b,c}` accounts: it registers them once and logs in on every
# later run. C is the stranger whose isolation is checked, so it is a gate
# account too rather than a per-run registration -- that was the check that
# skipped whenever this runner's IP had no registration budget left. A
# deployment that has never seen the gate is seeded once with
# ci-tooling/seed-smoke-accounts.sh from the host.
#
# Deletion coverage does not register anything either: DELETE /users/@me only
# schedules deletion (a grace period), freezing the account and killing its
# sessions, and a frozen account cannot authenticate, so the run that watches a
# freeze spends the account it watched. The deployment therefore carries a small
# ring of deletion subjects (`smoke_delete_1..4`, seeded with the gate accounts
# by the same script); a run freezes the first member that still logs in. Running
# that script again restores the members already frozen. SMOKE_USER_A/B/C (+ 
# SMOKE_PASSWORD) and SMOKE_TOKEN_A/B/C are still accepted as overrides, but no
# CI variable is needed for the job to run.
#
# SMOKE_TOKEN_A/B/C is the mode to prefer on a shared runner: with the three
# values set the suite performs no login at all, so a per-IP login limit cannot
# turn the release gate red (that is what did, on a runner whose egress had
# spent its hourly budget). Mint them once on the deployment with
# `ci-tooling/seed-smoke-accounts.sh --tokens` and store them as masked project
# variables; the suite stays on the cookie-login path when they are absent.
# The tokens survive a run: in this mode the suite skips the logout assertions
# rather than spend a session the next run needs, and says so every run.
live_smoke:
  stage: smoke
  image: alpine:3.20
  needs: []
  cache:
    - key: apk-cache-v1-live-smoke
      paths:
        - .cache/apk
      policy: pull-push
  variables:
    PLEXICHAT_BASE_URL: "https://api.plexichat.com/api/v1"
    # The gate is a test harness, not a shipped artifact: run the suite from the
    # integration branch so a fix to the suite reaches the next gate run instead
    # of waiting for a release tag to carry it (a gate that can only change at
    # release time cannot be fixed while a release is what it is blocking). The
    # deployment under test is still whatever PLEXICHAT_BASE_URL names.
    SMOKE_SCRIPT_REF: "dev"
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.cache/apk"
    - apk add --cache-dir "$CI_PROJECT_DIR/.cache/apk" bash curl jq
  script:
    # The runner reaches this GitLab over plain http (its git config rewrites
    # https://gitlab.plexichat.com/ to http://), so CI_PROJECT_URL's https form
    # may be unreachable from a job: keep it as the first try and fall back to
    # the same URL over http.
    - |
      set -eu
      ref="${SMOKE_SCRIPT_REF:-dev}"
      fetch() {
          curl -sSLf --max-time 30 -o /tmp/live-smoke.sh \
              "$1/-/raw/${ref}/ci-tooling/live-smoke.sh"
      }
      http_url="$(printf '%s' "$CI_PROJECT_URL" | sed 's|^https://|http://|')"
      fetch "$CI_PROJECT_URL" || fetch "$http_url"
      bash /tmp/live-smoke.sh
  environment:
    name: production
    url: https://plexichat.com
