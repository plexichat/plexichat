repos:
  - repo: local
    hooks:
      #  Ruff
      - id: ruff
        name: ruff
        entry: ruff check --fix .
        language: system
        pass_filenames: false
        args: [
          "--extend-exclude",
          ".venv,venv,.pytest_cache,cache,temp,temp_test,temp_test_*,temp_notifications_test,temp_relationships_test,temp_voice_test,temp_embeds_test,temp_test_security,uploads,media,config,logs,src/utils/common_utils,src/tests"
        ]
      - id: ruff-format
        name: ruff-format
        entry: ruff format .
        language: system
        pass_filenames: false

      #  Type checking
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        exclude: |
          (?x)^(
              src/core/migrations/cloner\.py|
              src/utils/encryption/kek_migration\.py|
              src/core/media/deduplication/.*\.py|
              src/api/routes/docs/.*\.py
          )$

      #  Basic security
      - id: bandit
        name: bandit
        entry: bandit
        language: system
        args: ["-c", ".bandit", "--severity-level", "medium", "--confidence-level", "high", "--baseline", ".bandit-baseline.json"]
        types: [python]
        exclude: ^src/tests/

      #  Semgrep disabled on Windows (Unicode encoding issues)
      # - id: semgrep
      #   name: semgrep
      #   entry: semgrep
      #   language: system
      #   types: [python]
      #   args: ["--config=auto", "--quiet"]

      #  Secret scanning
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: |
          (?x)^(
              src/tests/.*|
              docs/.*|
              .*/README\.md|
              \.bandit-baseline\.json|
              \.secrets\.baseline
          )$

      #  Pinned dependency vulnerability scan (tripwire on dep changes only).
      #  Scans the dev lock (which is a superset of requirements.txt) when
      #  online; if you are offline, `git commit --no-verify` is not needed --
      #  `SKIP=pip-audit git commit` keeps the tripwire out of your way. GitLab
      #  CI runs pip-audit per-commit as the authoritative gate.
      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: pip-audit -r requirements-dev.txt --require-hashes --progress-spinner=off
        language: system
        pass_filenames: false

      #  License gate for the shipped dependency tree. Fails on a new copyleft
      #  dependency or one whose license cannot be resolved; reviewed
      #  exceptions live in ALLOWED_COPYLEFT in ci-tooling/license_audit.py and
      #  are documented in THIRD_PARTY_NOTICES.md. Mirrors the web client's
      #  `npm run audit:licenses`. No network access required.
      - id: license-audit
        name: license audit (shipped dependencies)
        entry: python ci-tooling/license_audit.py
        language: system
        pass_filenames: false

      #  Verify the compiled lock files are valid (uv 'autogenerated' header)
      #  and fully hashed (every pinned package carries a --hash=sha256:).
      - id: requirements-lock-valid
        name: requirements lock valid + hashed
        entry: 'bash -c ''for f in requirements.txt requirements-dev.txt; do [ -f "$f" ] || { echo "$f missing"; exit 1; }; head -n 15 "$f" | grep -qiE "autogenerated|generated by uv|uv pip compile" || { echo "$f: missing uv autogenerated header"; exit 1; }; awk -v fn="$f" "/^[A-Za-z0-9._-]+==/ { if (pkg != \"\" && !has) { print fn\": package \"pkg\" has no hash\"; bad=1 } split(\$0, a, \"==\"); pkg=a[1]; has=0; next } /^--hash=/ { if (pkg != \"\") has=1; next } { pkg=\"\" } END { if (pkg != \"\" && !has) { print fn\": package \"pkg\" has no hash\"; bad=1 } exit bad }" "$f" || exit 1; done; echo "requirements lock validation OK (valid + fully hashed)"'''
        language: system
        pass_filenames: false