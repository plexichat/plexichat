name: plexichat

# Supply-chain policy (Agent 54 hardening, fail-closed by default).
#
# Compose ref pinning: this file is the canonical compose source. Operators
# who fetch it remotely MUST pin a released tag (e.g.
# BACKEND_VERSION=a.1.0-150) and verify the SHA256 sidecar / out-of-band
# digest before `docker compose up`. Fetching docker-compose.yml from the
# unreleased `dev` branch is forbidden unless explicitly opted into with
# ALLOW_DEV_COMPOSE=1, which the deploy script treats as tracking
# unverified infrastructure-as-code.
#
# Registry trust: first-party images default to the project's private
# registry (gitlab.plexichat.com, rewritten to registry.plexichat.com by the
# deploy script). Falling back to Docker Hub (docker.io, a different trust
# domain with unpinned digests and squattable namespaces) is forbidden
# unless explicitly opted into with ALLOW_DOCKERHUB_FALLBACK=1. Third-party
# images below are pinned to stable tags; verify digests out-of-band
# (`docker pull <image> && docker inspect --format '{{.RepoDigests}}'`)
# before production deploys.
#
# Secrets: every service here (except the static `client` nginx, which
# deliberately receives no env_file) reads the shared `.env`, which holds
# Postgres/Valkey/S3/restic secrets. Create it with `umask 077` and keep it
# `chmod 600` at all times; never commit it to version control.

# Version to deploy (e.g., a.1.0-55)
# Set via: BACKEND_VERSION=X CLIENT_VERSION=Y docker compose up -d
# Defaults to latest if not specified
#
# Scaling the backend across multiple workers:
#   docker compose up --scale backend=4
#
# When scaling, Valkey is REQUIRED — the cross-worker event dispatch
# layer (pub/sub on ``plexichat:events:cross_worker``) forwards events
# between worker processes so all WebSocket clients receive every event
# regardless of which worker they connected to.  Session tracking,
# rate limiting, and Snowflake IDs are also Valkey-backed for global
# consistency across replicas.
#
# When scaling >1, comment out the ``ports`` mappings on the backend
# service (host ports 8000/TCP and 30000-30100/UDP can only bind to
# one container) and rely on the client nginx proxy at :443 which
# load-balances to backend:8000 internally via Docker DNS round-robin.

services:
  db:
    restart: unless-stopped
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME:-plexichat}
      POSTGRES_USER: ${POSTGRES_USER:-plexichat}
      # Fail fast on unset/empty password rather than starting with no auth.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # postgres:18 stores its cluster in /var/lib/postgresql/<major>/docker and
      # hard-errors when /var/lib/postgresql/data is itself a mount
      # (docker-library/postgres#1259). Mount the parent, not the old data dir.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    restart: unless-stopped
    image: valkey/valkey:9.1.1-alpine
    env_file:
      - .env
    # Fail fast when VALKEY_PASSWORD is unset/empty - an empty --requirepass
    # would start Valkey with NO authentication.
    command: >
      sh -c "exec redis-server --appendonly yes --requirepass \"$${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}\""
    volumes:
      - valkey_data:/data
    healthcheck:
      # Authenticate via REDISCLI_AUTH so the password never appears in
      # process arguments (`redis-cli -a ...` leaks it in ps output).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-perms:
    image: alpine:3.24
    user: root
    volumes:
      - rustfs_data:/data
    # RustFS runs as non-root UID/GID 10001:10001, so the data volume must be
    # writable by that user before the server starts.
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:1.0.0-rc.3
    env_file:
      - .env
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data/rustfs}
      # Keep object storage private; browser media access goes through the
      # authenticated backend attachment route. Operators must explicitly
      # configure origins for a separate, signed browser-upload deployment.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - rustfs_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  rustfs-init:
    image: rustfs/rc:v0.1.30
    env_file:
      - .env
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
      rc mb local/$${S3_BUCKET} || true;
      "
    # One-shot init job: run once, exit 0, then stop. MUST NOT restart,
    # otherwise `backend` (which waits on service_completed_successfully)
    # would block forever because the container loops instead of completing.
    restart: "no"

  cert-init:
    image: alpine:3.24
    volumes:
      - certs:/certs
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache openssl >/dev/null;
      if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
        openssl req -x509 -nodes -newkey rsa:2048 -keyout /certs/privkey.pem -out /certs/fullchain.pem -days 365 -subj '/CN=localhost';
      fi
      "
    restart: "no"

  clamav:
    restart: unless-stopped
    image: clamav/clamav:1.5.4
    environment:
      CLAMD_CONF_StreamMaxLength: "600M"
      CLAMD_CONF_MaxScanSize: "600M"
      CLAMD_CONF_MaxFileSize: "600M"
      CLAMD_CONF_MaxScanTime: "300000"
    volumes:
      - clamav_db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  clamav-unofficial-sigs:
    restart: unless-stopped
    # Pinned to the 8.0.0 release (never :latest): a floating tag lets
    # rebuilds drift silently and defeats digest verification.
    image: ghcr.io/extremeshok/clamav-unofficial-sigs:8.0.0
    environment:
      CUS_MODE: updater
      CUS_UPDATE_HOURS: "2"
    volumes:
      - clamav_db:/var/lib/clamav
    depends_on:
      - clamav

  backend:
    restart: unless-stopped
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backend:${BACKEND_VERSION:-latest}
    env_file:
      - .env
    environment:
      PLEXICHAT_CONFIG: /app/config/docker-config.yaml
      PLEXICHAT_SMTP_PASSWORD: ${PLEXICHAT_SMTP_PASSWORD:-}
      PLEXICHAT_PUBLIC_SERVER_URL: ${PLEXICHAT_PUBLIC_SERVER_URL:-http://localhost:8000}
      NO_STRICT_CONFIG: "false"
      SCANNER_ENABLED: "true"
      SCANNER_HOST: clamav
      SCANNER_PORT: "3310"
      BACKEND_REPLICAS: ${BACKEND_REPLICAS:-1}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-sqlite_fts5}
      SEARCH_MEILISEARCH_HOST: ${SEARCH_MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      SEARCH_ELASTICSEARCH_HOSTS: ${SEARCH_ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
    volumes:
      # The server REWRITES this file on every start: it applies the env
      # overrides above through config.set() (which persists) and fills in
      # media.signing_key on first boot. Mounting the file/dir read-only makes
      # startup die with PermissionError, so the directory is mounted writable.
      - ./config:/app/config
      # The image runs as uid 10001 with HOME=/home/plexichat; /root is 0700
      # root, so data must not live under /root.
      - plexichat_home:/home/plexichat/.plexichat
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Host ports are fine for single-instance dev/prod.  When scaling
    # to multiple replicas (docker compose --scale backend=N or
    # deploy.replicas below), comment out BOTH port mappings — 8000/TCP
    # and 30000-30100/UDP can't bind to the host from multiple
    # containers.  The client nginx at :443 reverse-proxies to
    # backend:8000 internally regardless.
    ports:
      - "8000:8000"
      - "30000-30100:30000-30100/udp"
    # For Docker Swarm / stack deploy (has no effect with
    # ``docker compose up`` — use --scale instead):
    # deploy:
    #   replicas: ${BACKEND_REPLICAS:-2}
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

  client:
    restart: unless-stopped
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat-client}/nginx:${CLIENT_VERSION:-latest}
    # F8: no env_file here. The only variable this container needs is the CSP
    # connect-src list below (a public origin, never a secret), so injecting
    # the shared .env would expose DB/Valkey/S3/restic secrets to the
    # perimeter service with the largest attack surface for zero benefit.
    #
    # PLEXICHAT_CONNECT_SRC is rendered into the client image's CSP at
    # container start. It MUST list every origin config.js points serverUrl
    # at: with the default (`'self'`) a cross-origin API (e.g.
    # https://api.example.com) is blocked by the browser, and sign-up / the
    # capability probe fail with a connect-src violation. Images before
    # a.1.0-124 bake in `connect-src 'self'` and ignore this variable.
    environment:
      PLEXICHAT_CONNECT_SRC: ${PLEXICHAT_CONNECT_SRC:-'self'}
    depends_on:
      backend:
        condition: service_started
      cert-init:
        # Wait for the one-shot cert job to actually FINISH (not merely start):
        # on first boot nginx would otherwise race ahead of certificate
        # generation and crash-loop until a restart.
        condition: service_completed_successfully
    volumes:
      - certs:/etc/nginx/certs
      - ./docker/runtime/client-config.js:/usr/share/nginx/html/config.js:ro
    ports:
      - "80:80"
      - "443:443"

  backup:
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backup:${BACKEND_VERSION:-latest}
    # supercronic takes PID 1 as its cue to enable process reaping, and on
    # LXC/Docker hosts where /proc semantics differ it aborts with
    # "Failed to fork exec: no such file or directory". Running it under tini
    # (docker-init) keeps it off PID 1 and it schedules normally.
    init: true
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: /repo
      # Fail fast on unset/empty restic password - blank fallbacks make the
      # backup entrypoint crash-loop silently.
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?BACKUP_RESTIC_PASSWORD must be set}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_KEEP_YEARLY: ${BACKUP_KEEP_YEARLY:-0}
      BACKUP_INCLUDE_DB: ${BACKUP_INCLUDE_DB:-true}
      BACKUP_INCLUDE_HOME: ${BACKUP_INCLUDE_HOME:-true}
      BACKUP_INCLUDE_MEDIA: ${BACKUP_INCLUDE_MEDIA:-true}
      BACKUP_SECONDARY_REPO: ${BACKUP_SECONDARY_REPO:-}
      BACKUP_SECONDARY_PASSWORD: ${BACKUP_SECONDARY_PASSWORD:-}
      BACKUP_SUCCESS_HOOK: ${BACKUP_SUCCESS_HOOK:-}
      BACKUP_FAILURE_HOOK: ${BACKUP_FAILURE_HOOK:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - plexichat_home:/plexichat-home:ro
      - rustfs_data:/rustfs-data:ro
      - backup_repo:/repo
    restart: unless-stopped
    healthcheck:
      # Liveness = supercronic running AND a recent successful backup marker
      # (see /scripts/healthcheck.sh). Catches dead cron loops, broken mounts,
      # empty restic passwords and failed runs that previously went undetected.
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m

  # Local AI moderation (Shieldstral) - OPTIONAL.
  #
  # Profile-gated: only started when deploy passes --profile ai. The
  # Shieldstral-1.0-3B safety classifier (Apache-2.0) is served locally via
  # llama.cpp's OpenAI-compatible API, so no message content ever leaves the
  # host. The deploy script downloads the model + vision projector into
  # ./models/shieldstral, wires automod.ai.shieldstral into the backend
  # config, and enables the "ai" profile.
  #
  # GPU acceleration: deploy detects nvidia-container-toolkit and writes a
  # docker-compose.gpu.yml override that swaps LLAMA_IMAGE to the CUDA build
  # and adds the GPU device reservation (see deploy.sh / deploy.ps1).
  shieldstral:
    profiles: ["ai"]
    restart: unless-stopped
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b10614}
    environment:
      LLAMA_ARG_MODEL: /models/shieldstral/${SHIELDSTRAL_MODEL:-Shieldstral-1.0-3B-Q4_K_M.gguf}
      LLAMA_ARG_MMPROJ: /models/shieldstral/${SHIELDSTRAL_MMPROJ:-mmproj-Shieldstral-1.0-3b-BF16.gguf}
      LLAMA_ARG_CTX_SIZE: ${SHIELDSTRAL_CONTEXT:-4096}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      # Layers offloaded to the GPU. 0 = CPU only; -1/99 = all layers on the
      # GPU. deploy sets 99 on GPU hosts via the docker-compose.gpu.yml override.
      LLAMA_ARG_N_GPU_LAYERS: ${SHIELDSTRAL_GPU_LAYERS:-0}
    volumes:
      - ./models/shieldstral:/models/shieldstral:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${SHIELDSTRAL_MEM_LIMIT:-6G}


  # --- Search backends — optional, profile-gated ---
  # Default (no profile) is LOW-RESOURCE: Postgres tsvector / SQLite FTS5
  # embedded in the backend container, zero extra memory.  Use --profile
  # search-meilisearch for typo-tolerant ~150 MB, or --profile search-elastic
  # for heavy ~1 GB Elasticsearch when you need it.
  meilisearch:
    profiles: ["search", "search-meilisearch"]
    restart: unless-stopped
    image: getmeili/meilisearch:v1.12
    env_file:
      - .env
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_ENV: production
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meilisearch_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health | grep -q ok || curl -sf http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${MEILISEARCH_MEM_LIMIT:-512M}
        reservations:
          memory: 128M

  elasticsearch:
    profiles: ["search-elastic"]
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    env_file:
      - .env
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.name: plexichat
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q green || curl -sf http://localhost:9200/ | grep -q plexichat || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-2G}
        reservations:
          memory: 512M

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  plexichat_home:
  certs:
  backup_repo:
  clamav_db:
  meilisearch_data:
  elasticsearch_data: