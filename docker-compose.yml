name: plexichat

# Version to deploy (e.g., a.1.0-55)
# Set via: BACKEND_VERSION=X CLIENT_VERSION=Y docker compose up -d
# Defaults to latest if not specified
#
# Scaling the backend across multiple workers:
#   docker compose up --scale backend=4
#
# When scaling, Valkey is REQUIRED — the cross-worker event dispatch
# layer (pub/sub on ``plexichat:events:cross_worker``) forwards events
# between worker processes so all WebSocket clients receive every event
# regardless of which worker they connected to.  Session tracking,
# rate limiting, and Snowflake IDs are also Valkey-backed for global
# consistency across replicas.
#
# When scaling >1, comment out the ``ports`` mappings on the backend
# service (host ports 8000/TCP and 30000-30100/UDP can only bind to
# one container) and rely on the client nginx proxy at :443 which
# load-balances to backend:8000 internally via Docker DNS round-robin.

services:
  db:
    restart: unless-stopped
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME:-plexichat}
      POSTGRES_USER: ${POSTGRES_USER:-plexichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    restart: unless-stopped
    image: valkey/valkey:9.1.1-alpine
    env_file:
      - .env
    command: >
      sh -c "redis-server --appendonly yes --requirepass \"$${VALKEY_PASSWORD}\""
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${VALKEY_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-perms:
    image: alpine:3.24
    user: root
    volumes:
      - rustfs_data:/data
    # RustFS runs as non-root UID/GID 10001:10001, so the data volume must be
    # writable by that user before the server starts.
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    restart: unless-stopped
    image: rustfs/rustfs:latest
    env_file:
      - .env
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data/rustfs}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  rustfs-init:
    image: rustfs/rc:latest
    env_file:
      - .env
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
      rc mb local/$${S3_BUCKET} || true;
      rc anonymous set download local/$${S3_BUCKET} || true;
      "
    # One-shot init job: run once, exit 0, then stop. MUST NOT restart,
    # otherwise `backend` (which waits on service_completed_successfully)
    # would block forever because the container loops instead of completing.
    restart: "no"

  cert-init:
    image: alpine:3.24
    volumes:
      - certs:/certs
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache openssl >/dev/null;
      if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
        openssl req -x509 -nodes -newkey rsa:2048 -keyout /certs/privkey.pem -out /certs/fullchain.pem -days 365 -subj '/CN=localhost';
      fi
      "
    restart: "no"

  clamav:
    restart: unless-stopped
    image: clamav/clamav:latest
    environment:
      CLAMD_CONF_StreamMaxLength: "600M"
      CLAMD_CONF_MaxScanSize: "600M"
      CLAMD_CONF_MaxFileSize: "600M"
      CLAMD_CONF_MaxScanTime: "300000"
    volumes:
      - clamav_db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  clamav-unofficial-sigs:
    restart: unless-stopped
    image: ghcr.io/extremeshok/clamav-unofficial-sigs:latest
    environment:
      CUS_MODE: updater
      CUS_UPDATE_HOURS: "2"
    volumes:
      - clamav_db:/var/lib/clamav
    depends_on:
      - clamav

  backend:
    restart: unless-stopped
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backend:${BACKEND_VERSION:-latest}
    env_file:
      - .env
    environment:
      PLEXICHAT_CONFIG: /app/config/docker-config.yaml
      PLEXICHAT_SMTP_PASSWORD: ${PLEXICHAT_SMTP_PASSWORD:-}
      PLEXICHAT_PUBLIC_SERVER_URL: ${PLEXICHAT_PUBLIC_SERVER_URL:-http://localhost:8000}
      NO_STRICT_CONFIG: "false"
      SCANNER_ENABLED: "true"
      SCANNER_HOST: clamav
      SCANNER_PORT: "3310"
      BACKEND_REPLICAS: ${BACKEND_REPLICAS:-1}
    volumes:
      - ./config/docker-config.yaml:/app/config/docker-config.yaml:ro
      - plexichat_home:/root/.plexichat
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Host ports are fine for single-instance dev/prod.  When scaling
    # to multiple replicas (docker compose --scale backend=N or
    # deploy.replicas below), comment out BOTH port mappings — 8000/TCP
    # and 30000-30100/UDP can't bind to the host from multiple
    # containers.  The client nginx at :443 reverse-proxies to
    # backend:8000 internally regardless.
    ports:
      - "8000:8000"
      - "30000-30100:30000-30100/udp"
    # For Docker Swarm / stack deploy (has no effect with
    # ``docker compose up`` — use --scale instead):
    # deploy:
    #   replicas: ${BACKEND_REPLICAS:-2}
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

  client:
    restart: unless-stopped
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat-client}/nginx:${CLIENT_VERSION:-latest}
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      cert-init:
        condition: service_started
    volumes:
      - certs:/etc/nginx/certs
      - ./docker/runtime/client-config.js:/usr/share/nginx/html/config.js:ro
    ports:
      - "80:80"
      - "443:443"

  backup:
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backup:${BACKEND_VERSION:-latest}
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_KEEP_YEARLY: ${BACKUP_KEEP_YEARLY:-0}
      BACKUP_INCLUDE_DB: ${BACKUP_INCLUDE_DB:-true}
      BACKUP_INCLUDE_HOME: ${BACKUP_INCLUDE_HOME:-true}
      BACKUP_INCLUDE_MEDIA: ${BACKUP_INCLUDE_MEDIA:-true}
      BACKUP_SECONDARY_REPO: ${BACKUP_SECONDARY_REPO:-}
      BACKUP_SECONDARY_PASSWORD: ${BACKUP_SECONDARY_PASSWORD:-}
      BACKUP_SUCCESS_HOOK: ${BACKUP_SUCCESS_HOOK:-}
      BACKUP_FAILURE_HOOK: ${BACKUP_FAILURE_HOOK:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - plexichat_home:/plexichat-home:ro
      - rustfs_data:/rustfs-data:ro
      - backup_repo:/repo
    restart: unless-stopped

  # Local AI moderation (Shieldstral) - OPTIONAL.
  #
  # Profile-gated: only started when deploy passes --profile ai. The
  # Shieldstral-1.0-3B safety classifier (Apache-2.0) is served locally via
  # llama.cpp's OpenAI-compatible API, so no message content ever leaves the
  # host. The deploy script downloads the model + vision projector into
  # ./models/shieldstral, wires automod.ai.shieldstral into the backend
  # config, and enables the "ai" profile.
  #
  # GPU acceleration: deploy detects nvidia-container-toolkit and writes a
  # docker-compose.gpu.yml override that swaps LLAMA_IMAGE to the CUDA build
  # and adds the GPU device reservation (see deploy.sh / deploy.ps1).
  shieldstral:
    profiles: ["ai"]
    restart: unless-stopped
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    environment:
      LLAMA_ARG_MODEL: /models/shieldstral/${SHIELDSTRAL_MODEL:-Shieldstral-1.0-3B-Q4_K_M.gguf}
      LLAMA_ARG_MMPROJ: /models/shieldstral/${SHIELDSTRAL_MMPROJ:-mmproj-Shieldstral-1.0-3b-BF16.gguf}
      LLAMA_ARG_CTX_SIZE: ${SHIELDSTRAL_CONTEXT:-4096}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      # Layers offloaded to the GPU. 0 = CPU only; -1/99 = all layers on the
      # GPU. deploy sets 99 on GPU hosts via the docker-compose.gpu.yml override.
      LLAMA_ARG_N_GPU_LAYERS: ${SHIELDSTRAL_GPU_LAYERS:-0}
    volumes:
      - ./models/shieldstral:/models/shieldstral:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${SHIELDSTRAL_MEM_LIMIT:-6G}

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  plexichat_home:
  certs:
  backup_repo:
  clamav_db: