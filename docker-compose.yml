name: plexichat

# Supply-chain policy (fail-closed by default).
#
# Compose ref pinning: this file is the canonical compose source. Operators
# who fetch it remotely MUST pin a released tag (e.g.
# BACKEND_VERSION=1.0.0a236) and verify the SHA256 sidecar / out-of-band
# digest before `docker compose up`. Fetching docker-compose.yml from the
# unreleased `dev` branch is forbidden unless explicitly opted into with
# ALLOW_DEV_COMPOSE=1, which the deploy script treats as tracking
# unverified infrastructure-as-code.
#
# Image pinning: BACKEND_VERSION and CLIENT_VERSION are REQUIRED and must be
# explicit immutable release tags (or image digest refs) by default. Deploy
# scripts and `scripts/verify_supply_chain.py` refuse `latest`/`dev`/floating
# tags unless ALLOW_UNPINNED_IMAGES=1 (audited, non-production override).
# Third-party images are pinned to stable tags; prefer digest-pinned refs
# (`name:tag@sha256:...`) and keep `image-digests.lock.json`/SBOM artifacts
# current via `python scripts/generate_sbom.py`.
#
# Registry trust: first-party images default to the project's private
# registry (gitlab.plexichat.com, rewritten to registry.plexichat.com by the
# deploy script). Falling back to Docker Hub (docker.io, a different trust
# domain with unpinned digests and squattable namespaces) is forbidden
# unless explicitly opted into with ALLOW_DOCKERHUB_FALLBACK=1.
#
# Secrets: every service here (except the static `client` nginx, which
# deliberately receives no env_file) reads the shared `.env`, which holds
# Postgres/Valkey/S3/restic secrets. Create it with `umask 077` and keep it
# `chmod 600` at all times; never commit it to version control.

# Version to deploy (e.g., 1.0.0a236). REQUIRED by default.
# Set via: BACKEND_VERSION=X CLIENT_VERSION=Y docker compose up -d
# `latest`/`dev` are refused by deploy/config verification unless
# ALLOW_UNPINNED_IMAGES=1 is explicitly set for audited non-production use.
#
# Scaling the backend across multiple workers:
#   docker compose up --scale backend=4
#
# When scaling, Valkey is REQUIRED — the cross-worker event dispatch
# layer (pub/sub on ``plexichat:events:cross_worker``) forwards events
# between worker processes so all WebSocket clients receive every event
# regardless of which worker they connected to.  Session tracking,
# rate limiting, and Snowflake IDs are also Valkey-backed for global
# consistency across replicas.
#
# Set BACKEND_REPLICAS=N as well: the backend divides its fleet-wide
# PostgreSQL connection budget (90 by default) by that number. Leaving it
# at 1 while running four replicas opens four times too many sockets and
# exhausts Postgres under load.
#
# Bootstrap a fresh stack ONCE with a single backend before scaling. The
# first start persists env overrides into ./config/docker-config.yaml and
# generates media.signing_key there; starting N replicas against an
# uninitialized config races that one-time write and can leave replicas
# with different signing keys (broken signed media URLs).
#
# When scaling >1, comment out the ``ports`` mappings on the backend
# service (host ports 8000/TCP and 30000-30100/UDP can only bind to
# one container) and rely on the client nginx proxy at :443 which
# load-balances to backend:8000 internally via Docker DNS round-robin.
# The same caveat applies if BACKEND_SWARM_REPLICAS (below) is raised:
# Swarm's routing mesh publishes ports, plain ``compose up`` does not.
#
# Resource limits under ``deploy.resources.limits`` are PER REPLICA: a host
# running N backends needs roughly N x (backend CPU/memory) plus the fixed
# services. Raise/lower the *_MEM_LIMIT / *_CPU_LIMIT variables to fit.

services:
  db:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME:-plexichat}
      POSTGRES_USER: ${POSTGRES_USER:-plexichat}
      # Fail fast on unset/empty password rather than starting with no auth.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      # postgres:18 stores its cluster in /var/lib/postgresql/<major>/docker and
      # hard-errors when /var/lib/postgresql/data is itself a mount
      # (docker-library/postgres#1259). Mount the parent, not the old data dir.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Bound the shared database so a query storm from N backend replicas
    # cannot starve the rest of the host. Size generously: an OOM-killed
    # Postgres corrupts availability for every worker.
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-2}'
          memory: ${DB_MEM_LIMIT:-2G}
        reservations:
          memory: 512M

  valkey:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: valkey/valkey:9.1.1-alpine@sha256:15568b9cb7eb67f4aed4de018c23f13d344e0e6437b31fe8fb8823dc81ebb3a9
    env_file:
      - .env
    # Fail fast when VALKEY_PASSWORD is unset/empty - an empty --requirepass
    # would start Valkey with NO authentication.
    command: >
      sh -c "exec redis-server --appendonly yes --requirepass \"$${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}\""
    volumes:
      - valkey_data:/data
    healthcheck:
      # Authenticate via REDISCLI_AUTH so the password never appears in
      # process arguments (`redis-cli -a ...` leaks it in ps output).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sessions, rate limits and cross-worker events all live here. A hard
    # 2G ceiling keeps a runaway dataset from OOMing the host; raise it for
    # large session/cache datasets (eviction is intentionally left to the
    # application, so this is a safety net, not a cache-size setting).
    deploy:
      resources:
        limits:
          cpus: '${VALKEY_CPU_LIMIT:-1}'
          memory: ${VALKEY_MEM_LIMIT:-2G}
        reservations:
          memory: 256M

  rustfs-perms:
    security_opt:
      - no-new-privileges:true
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    user: root
    volumes:
      - rustfs_data:/data
    # RustFS runs as non-root UID/GID 10001:10001, so the data volume must be
    # writable by that user before the server starts.
    command: chown -R 10001:10001 /data
    restart: "no"

  rustfs:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    env_file:
      - .env
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: ${RUSTFS_ADDRESS:-0.0.0.0:9000}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      RUSTFS_VOLUMES: ${RUSTFS_VOLUMES:-/data/rustfs}
      # Keep object storage private; browser media access goes through the
      # authenticated backend attachment route. Operators must explicitly
      # configure origins for a separate, signed browser-upload deployment.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-}
    volumes:
      - rustfs_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '${RUSTFS_CPU_LIMIT:-2}'
          memory: ${RUSTFS_MEM_LIMIT:-2G}
        reservations:
          memory: 512M

  rustfs-init:
    security_opt:
      - no-new-privileges:true
    image: rustfs/rc:v0.1.30@sha256:1296510ec27800668d26a8bdca6251e587086187a9368c7b80134a169e8a3bb8
    env_file:
      - .env
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\"; do sleep 2; done;
      rc mb local/$${S3_BUCKET} || true;
      "
    # One-shot init job: run once, exit 0, then stop. MUST NOT restart,
    # otherwise `backend` (which waits on service_completed_successfully)
    # would block forever because the container loops instead of completing.
    restart: "no"

  cert-init:
    security_opt:
      - no-new-privileges:true
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    volumes:
      - certs:/certs
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache openssl >/dev/null;
      if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
        openssl req -x509 -nodes -newkey rsa:2048 -keyout /certs/privkey.pem -out /certs/fullchain.pem -days 365 -subj '/CN=localhost';
      fi
      "
    restart: "no"

  clamav:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    environment:
      CLAMD_CONF_StreamMaxLength: "600M"
      CLAMD_CONF_MaxScanSize: "600M"
      CLAMD_CONF_MaxFileSize: "600M"
      CLAMD_CONF_MaxScanTime: "300000"
    volumes:
      - clamav_db:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Signatures need ~1.2 GB at rest and ~2.4 GB during a reload (see
    # docker/README.md). 4G is the documented ceiling, not a tight fit.
    deploy:
      resources:
        limits:
          cpus: '${CLAMAV_CPU_LIMIT:-2}'
          memory: ${CLAMAV_MEM_LIMIT:-4G}
        reservations:
          memory: 1G

  clamav-unofficial-sigs:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    # Pinned to the 8.0.0 release (never :latest): a floating tag lets
    # rebuilds drift silently and defeats digest verification.
    image: ghcr.io/extremeshok/clamav-unofficial-sigs:8.0.0@sha256:7503b665d6d8a539bc493d2fe1b4aa4b1c3623e1e05c2e6f699c02c87827695c
    environment:
      CUS_MODE: updater
      CUS_UPDATE_HOURS: "2"
    volumes:
      - clamav_db:/var/lib/clamav
    depends_on:
      clamav:
        # The updater writes signature databases into the shared clamav_db
        # volume. Let clamd finish its initial load (service_healthy) before
        # mutating that volume, otherwise it can read a half-written DB.
        condition: service_healthy
    # Long-running updater, not a one-shot: without its own ceiling it can
    # consume unbounded CPU (signature decompression) and memory while the
    # rest of the stack is deliberately capped. Signature downloads plus the
    # unpacked DBs are modest, but a stuck unpack loop must not be able to
    # OOM the host or starve clamd, which shares the clamav_db volume.
    deploy:
      resources:
        limits:
          cpus: '${CLAMAV_SIGS_CPU_LIMIT:-1}'
          memory: ${CLAMAV_SIGS_MEM_LIMIT:-1G}
        reservations:
          memory: 128M

  backend:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    # The FastAPI process runs as UID 10001 and binds only unprivileged ports
    # (8000/TCP, 30000-30100/UDP); it needs no Linux capabilities. Dropping
    # them all limits the blast radius of a code-execution bug in the app or
    # in a spawned ffmpeg/subprocess.
    cap_drop:
      - ALL
    # Reap orphaned children (ffmpeg, websocket workers) that PID 1 would
    # otherwise leave as zombies for the lifetime of the container.
    init: true
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backend:${BACKEND_VERSION:?BACKEND_VERSION must be set to a pinned release tag/digest}
    env_file:
      - .env
    environment:
      PLEXICHAT_CONFIG: /app/config/docker-config.yaml
      PLEXICHAT_SMTP_PASSWORD: ${PLEXICHAT_SMTP_PASSWORD:-}
      PLEXICHAT_PUBLIC_SERVER_URL: ${PLEXICHAT_PUBLIC_SERVER_URL:-http://localhost:8000}
      NO_STRICT_CONFIG: "false"
      SCANNER_ENABLED: "true"
      SCANNER_HOST: clamav
      SCANNER_PORT: "3310"
      BACKEND_REPLICAS: ${BACKEND_REPLICAS:-1}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-sqlite_fts5}
      SEARCH_MEILISEARCH_HOST: ${SEARCH_MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-}
      SEARCH_ELASTICSEARCH_HOSTS: ${SEARCH_ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
    volumes:
      # The server REWRITES this file on every start: it applies the env
      # overrides above through config.set() (which persists) and fills in
      # media.signing_key on first boot. Mounting the file/dir read-only makes
      # startup die with PermissionError, so the directory is mounted writable.
      - ./config:/app/config
      # The image runs as uid 10001 with HOME=/home/plexichat; /root is 0700
      # root, so data must not live under /root.
      - plexichat_home:/home/plexichat/.plexichat
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/ready"]
      # Scaled-out workers warm up together and contend for DB/Valkey.
      # The old 5s/3-retry probe marked healthy replicas unhealthy on a
      # single slow response; keep a generous budget under load.
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Host ports are fine for single-instance dev/prod.  When scaling
    # to multiple replicas (docker compose --scale backend=N or
    # BACKEND_SWARM_REPLICAS below), comment out BOTH port mappings —
    # 8000/TCP and 30000-30100/UDP can't bind to the host from multiple
    # containers.  The client nginx at :443 reverse-proxies to
    # backend:8000 internally regardless.
    ports:
      - "8000:8000"
      - "30000-30100:30000-30100/udp"
    # Limits are PER REPLICA. 2 CPU / 2G is enough for one worker and
    # leaves room to scale N of them on a appropriately sized host.
    deploy:
      # Deliberately NOT BACKEND_REPLICAS: that variable is the pool-budget
      # hint passed into each container. Reusing it here could silently
      # start N containers with the host ports above still mapped.
      replicas: ${BACKEND_SWARM_REPLICAS:-1}
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-2}'
          memory: ${BACKEND_MEM_LIMIT:-2G}
        reservations:
          cpus: '${BACKEND_CPU_RESERVATION:-0.5}'
          memory: ${BACKEND_MEM_RESERVATION:-512M}
      # Swarm-only rolling updates: replace one worker at a time, keep the
      # old one serving until the new one is healthy, roll back on failure.
      # Plain `docker compose up` ignores this and uses --scale instead.
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s

  client:
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat-client}/nginx:${CLIENT_VERSION:?CLIENT_VERSION must be set to a pinned release tag/digest}
    # F8: no env_file here. The only variable this container needs is the CSP
    # connect-src list below (a public origin, never a secret), so injecting
    # the shared .env would expose DB/Valkey/S3/restic secrets to the
    # perimeter service with the largest attack surface for zero benefit.
    #
    # PLEXICHAT_CONNECT_SRC is rendered into the client image's CSP at
    # container start. It MUST list every origin config.js points serverUrl
    # at: with the default (`'self'`) a cross-origin API (e.g.
    # https://api.example.com) is blocked by the browser, and sign-up / the
    # capability probe fail with a connect-src violation. Images before
    # 1.0.0a124 bake in `connect-src 'self'` and ignore this variable.
    environment:
      PLEXICHAT_CONNECT_SRC: ${PLEXICHAT_CONNECT_SRC:-'self'}
    depends_on:
      backend:
        condition: service_started
      cert-init:
        # Wait for the one-shot cert job to actually FINISH (not merely start):
        # on first boot nginx would otherwise race ahead of certificate
        # generation and crash-loop until a restart.
        condition: service_completed_successfully
    volumes:
      - certs:/etc/nginx/certs
      - ./docker/runtime/client-config.js:/usr/share/nginx/html/config.js:ro
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '${CLIENT_CPU_LIMIT:-1}'
          memory: ${CLIENT_MEM_LIMIT:-512M}
        reservations:
          memory: 128M

  backup:
    image: ${CI_REGISTRY_IMAGE:-gitlab.plexichat.com/plexichat/plexichat}/backup:${BACKEND_VERSION:?BACKEND_VERSION must be set to a pinned release tag/digest}
    # supercronic takes PID 1 as its cue to enable process reaping, and on
    # LXC/Docker hosts where /proc semantics differ it aborts with
    # "Failed to fork exec: no such file or directory". Running it under tini
    # (docker-init) keeps it off PID 1 and it schedules normally.
    init: true
    env_file:
      - .env
    environment:
      RESTIC_REPOSITORY: /repo
      # Fail fast on unset/empty restic password - blank fallbacks make the
      # backup entrypoint crash-loop silently.
      RESTIC_PASSWORD: ${BACKUP_RESTIC_PASSWORD:?BACKUP_RESTIC_PASSWORD must be set}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_KEEP_YEARLY: ${BACKUP_KEEP_YEARLY:-0}
      BACKUP_INCLUDE_DB: ${BACKUP_INCLUDE_DB:-true}
      BACKUP_INCLUDE_HOME: ${BACKUP_INCLUDE_HOME:-true}
      BACKUP_INCLUDE_MEDIA: ${BACKUP_INCLUDE_MEDIA:-true}
      BACKUP_SECONDARY_REPO: ${BACKUP_SECONDARY_REPO:-}
      BACKUP_SECONDARY_PASSWORD: ${BACKUP_SECONDARY_PASSWORD:-}
      BACKUP_SUCCESS_HOOK: ${BACKUP_SUCCESS_HOOK:-}
      BACKUP_FAILURE_HOOK: ${BACKUP_FAILURE_HOOK:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - plexichat_home:/plexichat-home:ro
      - rustfs_data:/rustfs-data:ro
      - backup_repo:/repo
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Liveness = supercronic running AND a recent successful backup marker
      # (see /scripts/healthcheck.sh). Catches dead cron loops, broken mounts,
      # empty restic passwords and failed runs that previously went undetected.
      test: ["CMD-SHELL", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    # Restic's dedup index can balloon on a large repo; keep it bounded but
    # well above the working set so a scheduled backup is never OOM-killed.
    deploy:
      resources:
        limits:
          cpus: '${BACKUP_CPU_LIMIT:-1}'
          memory: ${BACKUP_MEM_LIMIT:-2G}
        reservations:
          memory: 256M

  # Local AI moderation (Shieldstral) - OPTIONAL.
  #
  # Profile-gated: only started when deploy passes --profile ai. The
  # Shieldstral-1.0-3B safety classifier (Apache-2.0) is served locally via
  # llama.cpp's OpenAI-compatible API, so no message content ever leaves the
  # host. The deploy script downloads the model + vision projector into
  # ./models/shieldstral, wires automod.ai.shieldstral into the backend
  # config, and enables the "ai" profile.
  #
  # GPU acceleration: deploy detects nvidia-container-toolkit and writes a
  # docker-compose.gpu.yml override that swaps LLAMA_IMAGE to the CUDA build
  # and adds the GPU device reservation (see deploy.sh / deploy.ps1).
  shieldstral:
    profiles: ["ai"]
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    # Was `server-b10614`, which no longer resolves; pin the current concrete
    # build (b12464) by digest so the default AI profile actually pulls.
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b12464@sha256:5b43086e3ba7ea5794d72904654f6cd41224a9b1c6ac0398f4940ee380d30f23}
    environment:
      LLAMA_ARG_MODEL: /models/shieldstral/${SHIELDSTRAL_MODEL:-Shieldstral-1.0-3B-Q4_K_M.gguf}
      LLAMA_ARG_MMPROJ: /models/shieldstral/${SHIELDSTRAL_MMPROJ:-mmproj-Shieldstral-1.0-3b-BF16.gguf}
      LLAMA_ARG_CTX_SIZE: ${SHIELDSTRAL_CONTEXT:-4096}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      # Layers offloaded to the GPU. 0 = CPU only; -1/99 = all layers on the
      # GPU. deploy sets 99 on GPU hosts via the docker-compose.gpu.yml override.
      LLAMA_ARG_N_GPU_LAYERS: ${SHIELDSTRAL_GPU_LAYERS:-0}
    volumes:
      - ./models/shieldstral:/models/shieldstral:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${SHIELDSTRAL_CPU_LIMIT:-4}'
          memory: ${SHIELDSTRAL_MEM_LIMIT:-6G}


  # --- Search backends — optional, profile-gated ---
  # Default (no profile) is LOW-RESOURCE: Postgres tsvector / SQLite FTS5
  # embedded in the backend container, zero extra memory.  Use --profile
  # search-meilisearch for typo-tolerant ~150 MB, or --profile search-elastic
  # for heavy ~1 GB Elasticsearch when you need it.
  meilisearch:
    profiles: ["search", "search-meilisearch"]
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: getmeili/meilisearch:v1.15@sha256:fe500cf9cca05cb9f027981583f28eccf17d35d94499c1f8b7b844e7418152fc
    # No env_file: this optional third-party service only needs the master
    # key below, which Compose interpolates from .env at deploy time. Injecting
    # the whole file would hand Postgres/Valkey/S3/restic secrets to a service
    # that has no need for them (same F8 rule as the perimeter `client`).
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_ENV: production
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meilisearch_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      # GET /health answers {"status":"available"} (with HTTP 200) once ready
      # and 503 while booting. Assert that status explicitly: the previous
      # `grep -q ok` never matched Meili's payload and only "passed" by falling
      # through to a bare curl that did not validate readiness at all.
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q available || wget -qO- http://localhost:7700/health | grep -q available"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '${MEILISEARCH_CPU_LIMIT:-1}'
          memory: ${MEILISEARCH_MEM_LIMIT:-512M}
        reservations:
          memory: 128M

  elasticsearch:
    profiles: ["search-elastic"]
    restart: unless-stopped
    # Deny setuid/setgid escalation and file-capability gain inside the
    # container. Legitimate privilege *drops* by image entrypoints still work.
    security_opt:
      - no-new-privileges:true
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0@sha256:e1e66bfabae0fd03a0a36651a9bb198e7f061e0c99f457a6203b116e053e9cdb
    # No env_file for the same reason as meilisearch: none of the shared
    # .env secrets are needed here, and `ES_JAVA_OPTS` is interpolated below.
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.name: plexichat
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    healthcheck:
      # A single-node cluster with the default replica count is YELLOW, never
      # GREEN. Requiring only "green" made the check always fall through to the
      # weak root-endpoint grep; accept both healthy states explicitly instead.
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '${ES_CPU_LIMIT:-2}'
          memory: ${ES_MEM_LIMIT:-2G}
        reservations:
          memory: 512M

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  plexichat_home:
  certs:
  backup_repo:
  clamav_db:
  meilisearch_data:
  elasticsearch_data: