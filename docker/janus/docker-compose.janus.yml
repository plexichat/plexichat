# Local Janus gateway for the opt-in media tests
# (``src/tests/voice/test_sfu_janus_gateway.py``) and for running the server
# against a real ``janus`` backend (``voice.sfu_backend: janus``).
#
# Bring it up with ``./run-janus-gateway.sh``, which also waits for the
# VideoRoom plugin and prints the environment to run the tests with.
#
# Supply chain: pin the released tag to its manifest digest, exactly as
# ``docker-compose.yml`` pins every third-party image. A tag alone is mutable
# in the registry, so ``0.10.7`` could be silently replaced between pulls.
# Re-verify the digest out of band before bumping it:
#
#   docker buildx imagetools inspect canyan/janus-gateway:0.10.7
#
# This is a DEVELOPMENT gateway, not a deployment. The Janus API is
# unauthenticated (no ``api_secret``), so its HTTP/WS ports are published on
# LOOPBACK (127.0.0.1) only -- never on 0.0.0.0 where any host on the network
# could reconfigure it. Do not expose them to a shared or production network,
# and do not point a production voice deployment at it.
#
# Networking: only the API is published. WebRTC media candidates are gathered
# inside the container, so real RTP between peers needs host networking, or
# ``nat_1_1_mapping`` in a mounted ``janus.jcfg`` set to the host address (see
# README.md). The signaling tests this file exists for -- room creation, the
# publish/jsep handshake, trickle relay, layer configure, teardown -- do not
# need media to flow.
name: plexichat-janus

services:
  janus:
    image: canyan/janus-gateway:0.10.7@sha256:75328c0f7ea83346aec7a1ba22bfbb980f2b6196a692c390020a5da0adb30e3e
    # Same kernel-level backstop as every service in the main stack: a
    # compromised janus process cannot gain privileges via setuid/capabilities.
    security_opt:
      - no-new-privileges:true
    command: ["/usr/local/bin/janus", "-F", "/usr/local/etc/janus"]
    ports:
      # Loopback-only: the API is unauthenticated, so a 0.0.0.0 bind would let
      # anyone on the LAN create/destroy VideoRooms or read its state.
      - "127.0.0.1:8088:8088" # HTTP API: http://127.0.0.1:8088/janus
      - "127.0.0.1:8188:8188" # WebSocket API; the REST adapter does not use it
    restart: unless-stopped
