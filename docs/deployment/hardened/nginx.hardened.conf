# Hardened nginx edge config for Plexichat (TLS termination + reverse proxy).
# Mount real certificates into /etc/nginx/certs (fullchain.pem, privkey.pem).
# Replace server_name and PLEXICHAT_CONNECT_SRC handling for your deployment.
# Rendered by the client image entrypoint (envsubst for ${PLEXICHAT_CONNECT_SRC}).

server {
    listen 80;
    server_name _;
    # Redirect all HTTP to HTTPS. For ACME HTTP-01, add a /.well-known challenge
    # location before this return or terminate ACME at a dedicated edge.
    location / {
        return 301 https://$host$request_uri;
    }
}

upstream backend {
    ip_hash;
    server backend:8000;
    keepalive 32;
}

# Optional: restrict /admin at the edge to a management allowlist.
# Uncomment and set your jump-host / VPN CIDRs.
# geo $admin_allowed {
#     default 0;
#     127.0.0.1 1;
#     ::1 1;
#     10.0.0.0/8 1;   # replace with your management network
# }

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening (adjust to your compliance baseline).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Enable OCSP stapling when using a publicly trusted CA and resolver:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver <trusted-dns> valid=300s;

    # Request limits
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Security headers (repeat in locations that set add_header).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src ${PLEXICHAT_CONNECT_SRC}; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:; manifest-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml text/css text/html text/plain text/xml;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy headers — backend must trust ONLY this proxy (api.trusted_proxies).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        gzip off;
        proxy_pass http://backend;
    }

    location /docs {
        proxy_pass http://backend/docs;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
    }

    location /redoc {
        proxy_pass http://backend/redoc;
    }

    location /admin {
        # Edge allowlist (enable geo $admin_allowed above to enforce):
        # if ($admin_allowed = 0) { return 403; }
        proxy_pass http://backend/admin;
    }

    location /gateway {
        proxy_pass http://backend/gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src ${PLEXICHAT_CONNECT_SRC}; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:; manifest-src 'self'; frame-ancestors 'none'" always;
    }

    location = /config.js {
        gzip_static off;
        add_header Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src ${PLEXICHAT_CONNECT_SRC}; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:; manifest-src 'self'; frame-ancestors 'none'" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src ${PLEXICHAT_CONNECT_SRC}; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:; manifest-src 'self'; frame-ancestors 'none'" always;
    }

    location = /app { try_files /app.html =404; }
    location ^~ /app/ { try_files /app.html =404; }
    location = /settings { try_files /settings.html =404; }
    location ^~ /settings/ { try_files /settings.html =404; }
    location / { try_files $uri $uri/ /index.html; }
}
