# Single source of truth for bandit: the pre-commit hook runs
# ``bandit -c pyproject.toml``. A second config (``.bandit``) used to sit
# beside this one and the two drifted -- different skips (B101 was skipped
# there but not here), a different ``severity`` spelling, and different
# ``targets`` -- so which rules actually ran depended on how bandit was
# invoked. Keep bandit settings here and nowhere else; src/tests/security/
# test_bandit_config.py fails if a second file reappears or the hook stops
# pointing at this one.
[tool.bandit]
skips = ["B601"]
confidence = "HIGH"
severity = "MEDIUM"
# Bandit reads this key as ``exclude_dirs`` (the ``exclude`` spelling is only
# honoured by the ``--exclude`` CLI flag / a ``.bandit`` INI key), so the
# previous spelling left src/tests in scope and surfaced test-only findings
# (e.g. the SHA1 helpers in test_valkey.py).
#
# Bandit matches each entry as a glob *and* as a plain substring of the path
# (``any(x in path ...)``), so a bare token shadows every path that contains
# it. Bare ``media`` hid src/core/media (44 files) and src/api/routes/media.py,
# ``cache`` hid src/core/database/cache (10 files), ``temp`` hid
# src/core/servers/templates.py, and ``logs`` hid src/api/routes/admin/logs.py
# — 91 tracked source files the hook never scanned. An entry that is (or later
# becomes) a substring of tracked source hides it, so test_bandit_config.py
# fails if that happens.
exclude_dirs = [".venv", "venv", ".pytest_cache", "test_artifacts", "uploads", "src/tests", "tests", "**/__pycache__"]
# The entry point is scanned alongside src/; test dirs are excluded above.
# B101 (assert) is intentionally NOT globally skipped — assert in production
# code is a security concern. Use `# nosec B101` for legitimate uses.
targets = ["src", "main.py"]

# Keep test-run caches/artifacts out of the repo root.
[tool.coverage.run]
data_file = "test_artifacts/coverage/.coverage"

[tool.ruff]
cache-dir = "test_artifacts/ruff"
