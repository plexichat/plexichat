[pytest]
# Python path setup
pythonpath =
    .
    src
    src/utils
    src/utils/common_utils

# Test discovery
testpaths =
    src/tests
    src/utils/common_utils/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Keep test-run caches/artifacts out of the repo root
cache_dir = test_artifacts/pytest_cache

# Only the Hypothesis cache dir is skipped. The settings/stickers/search/
# soundboard/security directories and the database load/benchmark files were
# previously excluded due to fixture issues that are since resolved; they are
# now part of the default run (verified passing in isolation).
norecursedirs = .hypothesis test_artifacts

# Markers
markers =
    unit: Fast unit tests, no database required
    integration: Tests requiring full module setup
    slow: Intentionally slow tests (rate limiting, timeouts)
    security: Security-related tests that must not fail
    auth: Authentication module tests
    messaging: Messaging module tests
    servers: Server module tests
    presence: Presence module tests
    relationships: Relationships module tests
    reactions: Reactions module tests
    webhooks: Webhooks module tests
    threads: Threads module tests
    notifications: Notifications module tests
    ratelimit: Rate limiting tests
    api: API route tests
    applications: Applications module tests
    media: Media module tests
    search: Search module tests
    stickers: Stickers module tests
    polls: Polls module tests
    soundboard: Soundboard module tests
    settings: User settings module tests
    voice: Voice module tests
    websocket: WebSocket module tests
    encryption: Encryption module tests
    embeds: Embeds module tests
    automod: Auto-moderation module tests
    performance: Performance and load tests
    production_simulation: Production simulation tests
    multiprocess: Multiprocess tests
    requires_postgres: Tests requiring PostgreSQL
    needs_valkey: Tests that require a live Valkey instance
    crypto_heavy: Tests that use real Argon2/HKDF/chain hashing
    database_integration: Tests requiring a real database backend
    benchmark: Performance benchmark tests
    postgres: Tests requiring PostgreSQL/Docker


# Default options
# NOTE: xdist parallelism is opt-in via PYTEST_XDIST=1 so the
# Windows dev machine (no GNU parallel) still runs serially. The
# ``-n auto --dist loadfile`` combination maximises cache hits by
# pinning each file to one worker.
#
# ``requires_postgres`` is deliberately NOT deselected here: the
# Postgres fixtures skip visibly ("PostgreSQL not available") when no
# backend is reachable and RUN when one is, so Postgres-specific
# coverage is never silently dropped from the default run.
    --strict-markers
    --tb=short
    --maxfail=50
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    --timeout=60
    -m "not slow and not performance and not production_simulation and not multiprocess"

# Suppress third-party deprecation warnings that are outside our control
filterwarnings =
    # starlette 1.3.1 unconditionally prefers a package literally named
    # ``httpx2`` in its test client, which does not exist upstream, so this
    # warning can never be actioned (downgrading starlette would require
    # regenerating the hashed requirement locks for zero benefit).
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*
    # Transient GC-timing ResourceWarnings: the connections are properly
    # managed by the pool and cleaned up at test teardown, but Python's
    # garbage collector runs at unpredictable times and can find them
    # during JSON decoding or other operations. These are not actual leaks.
    ignore::ResourceWarning:src.core.suite.sum
    ignore::ResourceWarning:src.core.messaging.repositories

# Minimum pytest version
minversion = 7.0

# Console output style
console_output_style = progress

# JUnit XML output for CI/CD
junit_family = xunit2
